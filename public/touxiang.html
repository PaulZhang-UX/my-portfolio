<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scanline Portrait</title>
  <style>
    :root {
      --scan-color: #9CFFAE;
      --scan-background: #000000;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--scan-background); }
    body { display: grid; place-items: center; }
    .scanline-portrait {
      width: min(100%, 900px);
      background: var(--scan-background);
    }
    .scanline-portrait canvas {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="scanline-portrait">
    <canvas id="scanlineCanvas" aria-label="Scanline portrait"></canvas>
  </div>

  <script>
    // 修改这些参数即可更换颜色、方向和扫描线结构。
    const CONFIG = {
  "direction": "vertical",
  "gap": 5,
  "lineWidth": 1.9,
  "maxLen": 17,
  "contrast": 1,
  "preserveTone": 0.5,
  "threshold": 0,
  "gamma": 0.9,
  "glowBlur": 5,
  "posterize": 10,
  "glitch": 4,
  "zoom": 1.3,
  "positionX": 0.5,
  "positionY": 0.5,
  "tint": "#9CFFAE",
  "background": "#000000",
  "aspect": "3:4"
};
    const IMAGE_SRC = "/avatar.png";

    const canvas = document.getElementById("scanlineCanvas");
    const wrapper = canvas.parentElement;
    const image = new Image();
    let resizeTimer = 0;

    image.onload = render;
    image.src = IMAGE_SRC;

    new ResizeObserver(() => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(render, 80);
    }).observe(wrapper);

    window.ScanlinePortrait = {
      config: CONFIG,
      update(patch = {}) {
        Object.assign(CONFIG, patch);
        render();
      },
      render
    };

    function render() {
      if (!image.complete || !image.naturalWidth) return;

      const cssWidth = Math.max(280, wrapper.clientWidth || 720);
      const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      const width = Math.round(cssWidth * pixelRatio);
      const height = getHeight(width, CONFIG.aspect, image);
      renderPortrait(canvas, image, width, height, CONFIG);
    }

    function renderPortrait(canvas, image, width, height, cfg) {
      const ctx = canvas.getContext("2d", { alpha: true });
      canvas.width = width;
      canvas.height = height;

      const source = document.createElement("canvas");
      source.width = width;
      source.height = height;
      const sctx = source.getContext("2d", { willReadFrequently: true });

      sctx.fillStyle = cfg.background;
      sctx.fillRect(0, 0, width, height);
      drawImageCover(sctx, image, width, height, cfg.zoom, cfg.positionX, cfg.positionY);

      const imageData = sctx.getImageData(0, 0, width, height);
      const lum = buildLuminanceMap(imageData.data, cfg);

      ctx.fillStyle = cfg.background;
      ctx.fillRect(0, 0, width, height);
      drawGhostLayer(ctx, lum, width, height, cfg);

      ctx.save();
      ctx.strokeStyle = cfg.tint;
      ctx.lineWidth = cfg.lineWidth * Math.max(1, width / 720);
      ctx.lineCap = "round";
      ctx.shadowColor = hexToRgba(cfg.tint, 0.28);
      ctx.shadowBlur = cfg.glowBlur * Math.max(1, width / 720);
      drawScanlines(ctx, lum, width, height, cfg);
      ctx.restore();

      overlayGlitch(ctx, width, height, cfg);
      overlayVignette(ctx, width, height);
    }

    function buildLuminanceMap(data, cfg) {
      const lum = new Float32Array(data.length / 4);
      for (let i = 0, p = 0; i < data.length; i += 4, p++) {
        let value =
          0.2126 * (data[i] / 255) +
          0.7152 * (data[i + 1] / 255) +
          0.0722 * (data[i + 2] / 255);
        value = clamp((value - 0.5) * cfg.contrast + 0.5, 0, 1);
        value = Math.pow(value, cfg.gamma);
        value = Math.round(value * cfg.posterize) / cfg.posterize;
        lum[p] = value;
      }
      return lum;
    }

    function drawGhostLayer(ctx, lum, width, height, cfg) {
      if (cfg.preserveTone <= 0) return;

      const ghostCanvas = document.createElement("canvas");
      ghostCanvas.width = width;
      ghostCanvas.height = height;

      const ghostCtx = ghostCanvas.getContext("2d", { alpha: true });
      const output = ghostCtx.createImageData(width, height);
      const rgb = hexToRgb(cfg.tint);

      for (let p = 0, i = 0; p < lum.length; p++, i += 4) {
        output.data[i] = rgb.r;
        output.data[i + 1] = rgb.g;
        output.data[i + 2] = rgb.b;
        output.data[i + 3] =
          Math.pow(lum[p], 1.25) * cfg.preserveTone * 255;
      }

      ghostCtx.putImageData(output, 0, 0);

      ctx.save();
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 1;
      ctx.drawImage(ghostCanvas, 0, 0);
      ctx.restore();
    }

    function drawScanlines(ctx, lum, width, height, cfg) {
      const scale = Math.max(1, width / 720);
      const gap = Math.max(1, cfg.gap * scale);
      const maxLen = cfg.maxLen * scale;

      if (cfg.direction === "vertical") {
        for (let x = 0; x < width; x += gap) {
          for (let y = 0; y < height; y += gap) {
            drawSample(ctx, lum, width, x, y, cfg, maxLen, true);
          }
        }
      } else {
        for (let y = 0; y < height; y += gap) {
          for (let x = 0; x < width; x += gap) {
            drawSample(ctx, lum, width, x, y, cfg, maxLen, false);
          }
        }
      }
      ctx.globalAlpha = 1;
    }

    function drawSample(ctx, lum, width, x, y, cfg, maxLen, vertical) {
      const value = lum[Math.floor(y) * width + Math.floor(x)];
      if (value < cfg.threshold) return;
      const normalized = clamp(
        (value - cfg.threshold) / (1 - cfg.threshold),
        0,
        1
      );
      const length = 1.5 + normalized * maxLen;
      const cut = (1 - normalized) * 1.8;
      ctx.globalAlpha = clamp(normalized * 1.08, 0, 1);
      ctx.beginPath();
      if (vertical) {
        ctx.moveTo(x, y - length * 0.5 + cut);
        ctx.lineTo(x, y + length * 0.5 - cut);
      } else {
        ctx.moveTo(x - length * 0.5 + cut, y);
        ctx.lineTo(x + length * 0.5 - cut, y);
      }
      ctx.stroke();
    }

    function overlayGlitch(ctx, width, height, cfg) {
      if (cfg.glitch <= 0) return;
      const random = mulberry32(
        Math.floor(cfg.gap * 97 + cfg.maxLen * 31 + cfg.contrast * 100)
      );
      ctx.save();
      ctx.globalAlpha = 0.12;
      ctx.strokeStyle = cfg.tint;
      ctx.lineWidth = 1;
      for (let i = 0; i < Math.floor(cfg.glitch); i++) {
        const y = random() * height;
        const x1 = random() * width * 0.22;
        const x2 = width - random() * width * 0.22;
        ctx.beginPath();
        ctx.moveTo(x1, y);
        ctx.lineTo(x2, y + (random() - 0.5) * 2.2);
        ctx.stroke();
      }
      ctx.restore();
    }

    function overlayVignette(ctx, width, height) {
      const g = ctx.createRadialGradient(
        width * 0.5, height * 0.42, width * 0.08,
        width * 0.5, height * 0.5, Math.max(width, height) * 0.72
      );
      g.addColorStop(0, "rgba(0,0,0,0)");
      g.addColorStop(1, "rgba(0,0,0,.48)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, width, height);
    }

    function drawImageCover(ctx, image, width, height, zoom, px, py) {
      const scale = Math.max(width / image.width, height / image.height) * zoom;
      const drawWidth = image.width * scale;
      const drawHeight = image.height * scale;
      ctx.drawImage(
        image,
        (width - drawWidth) * px,
        (height - drawHeight) * py,
        drawWidth,
        drawHeight
      );
    }

    function getHeight(width, aspect, image) {
      if (aspect === "original") {
        return Math.round(width * image.height / image.width);
      }
      const parts = aspect.split(":").map(Number);
      return Math.round(width * parts[1] / parts[0]);
    }

    function normalizeHex(value) {
      const text = String(value).trim();
      if (/^#[0-9a-fA-F]{6}$/.test(text)) return text;
      return "#FFFFFF";
    }

    function hexToRgb(hex) {
      const value = normalizeHex(hex);
      return {
        r: parseInt(value.slice(1, 3), 16),
        g: parseInt(value.slice(3, 5), 16),
        b: parseInt(value.slice(5, 7), 16)
      };
    }

    function hexToRgba(hex, alpha) {
      const rgb = hexToRgb(hex);
      return "rgba(" + rgb.r + "," + rgb.g + "," + rgb.b + "," + alpha + ")";
    }

    function mulberry32(seed) {
      return function () {
        let t = seed += 0x6D2B79F5;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }
  </script>
</body>
</html>
